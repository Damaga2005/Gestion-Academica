<!doctype html>
<html lang="es" data-theme="{{ tema_actual }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}Gestión Académica GREELEC{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a href="{{ url_for('vistas.dashboard') }}" class="brand">GREELEC</a>
    <nav>
      <a href="{{ url_for('vistas.dashboard') }}">Inicio</a>
      <a href="{{ url_for('vistas.index') }}">Asignaturas</a>
      <a href="{{ url_for('vistas.vista_calendario') }}">Calendario</a>
      <a href="{{ url_for('vistas.vista_repaso') }}">Repaso</a>
      <a href="{{ url_for('vistas.vista_ajustes') }}">Ajustes</a>
    </nav>
    <div class="buscador-global">
      <input type="search" id="buscador-input" placeholder="Buscar asignaturas, documentos, notas, tareas...">
      <div id="buscador-resultados" class="buscador-resultados oculto"></div>
    </div>
    <button id="toggle-tema" class="toggle-tema" type="button" title="Cambiar tema"></button>
    {% if lock_activo %}
    <form method="post" action="{{ url_for('auth.cerrar_sesion') }}" class="form-lock">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="toggle-tema" title="Bloquear la app">🔒</button>
    </form>
    {% endif %}
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='js/tema.js') }}"></script>
  <script src="{{ url_for('static', filename='js/buscador.js') }}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
